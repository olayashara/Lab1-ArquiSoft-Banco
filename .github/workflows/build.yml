name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/cloud-deploy

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. Pruebas unitarias y reporte JaCoCo
  # ==========================================
  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: banco-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: banco-backend/pom.xml

      - name: Run tests and generate JaCoCo report
        run: mvn -B -ntp clean test -DfailIfNoTests=false

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            banco-backend/target/surefire-reports/
            banco-backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  # ==========================================
  # 2. Análisis de código con SonarCloud
  # ==========================================
  sonar:
    name: SonarCloud analysis
    needs: tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: banco-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: banco-backend/pom.xml

      # Re-ejecuta test sin sobreescribir resultados limpios para asegurar que JaCoCo XML esté en disco
      - name: Generate Coverage Report
        run: mvn -B -ntp test -DfailIfNoTests=false

      - name: Verify JaCoCo XML report
        run: |
          if [ ! -f target/site/jacoco/jacoco.xml ]; then
            echo "ERROR: JaCoCo XML report was not generated."
            exit 1
          fi
          echo "JaCoCo XML report found."
          ls -lh target/site/jacoco/jacoco.xml

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=olayashara \
            -Dsonar.projectKey=olayashara_Lab1-ArquiSoft-Banco \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.token="$SONAR_TOKEN"

  # ==========================================
  # 3. Construcción y publicación del JAR
  # ==========================================
  build:
    name: Build Artifact
    needs: sonar
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: banco-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: banco-backend/pom.xml

      - name: Build with Maven
        run: mvn -B -ntp package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-jar
          path: banco-backend/target/*.jar
          if-no-files-found: error
          retention-days: 7